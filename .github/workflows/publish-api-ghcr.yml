name: Build & push cron-agent image (GHCR)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to homelab via webhook (push to GHCR always happens)"
        type: boolean
        default: true
      app_root:
        description: "APP_ROOT — root build directory (base path) for the web app, e.g. /cron-agent"
        type: string
        default: "/cron-agent"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cron-agent

jobs:
  validate:
    name: Validate (tests + web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run backend tests (SQLite, no services needed)
        run: dotnet test tests/Api.Tests --nologo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Build frontend (typecheck + vite)
        working-directory: src/Web
        env:
          APP_ROOT: ${{ inputs.app_root || '/cron-agent' }}
        run: npm ci && npm run build

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=cron-agent
            org.opencontainers.image.description=Self-hosted cron job agent — schedules HTTP POST webhooks (simplified 6-field cron, Manila time), with retries, catch-up dispatch ("do not catch up" / "run once"), Atlas Rig OIDC auth, and a React job history UI.

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_AR_AUTH_CLIENT_ID=cron-agent-ui
            VITE_AR_AUTH_SCOPE=openid profile email api://cron-agent/user
            APP_ROOT=${{ inputs.app_root || '/cron-agent' }}

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} @ ${{ steps.build.outputs.digest }}"

  deploy:
    needs: [validate, build]
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homelab deploy webhook (gh_webhooks)
        env:
          CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOOK_SECRET: ${{ secrets.HOMELAB_WEBHOOK_SECRET }}
        run: |
          # GHCR gets tags like sha-<short7> (metadata-action, prefix=sha-); post
          # the same format here or the webhook pulls a tag that doesn't exist
          TAG="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
          BODY=$(jq -nc --arg repo "${{ github.repository }}" --arg tag "$TAG" '{repo:$repo, tag:$tag}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d' ' -f1)
          echo "Triggering webhook for ${BODY}"
          curl --fail-with-body --show-error --retry 3 --retry-all-errors --max-time 30 \
            --write-out '\nHTTP status: %{http_code}\n' \
            -H "CF-Access-Client-Id: $CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "X-Timestamp: $TS" -H "X-Signature: $SIG" \
            -H "Content-Type: application/json" --data "$BODY" \
            https://apis.adolfrey.com/gh_webhooks/d
